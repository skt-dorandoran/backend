name: deploy-api

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          # script_stop: true
          envs: APP_DIR,TARGET_BRANCH,REPO_URL,CONTAINER_NAME,IMAGE_NAME,CONTEXT_DIR,DEEPGRAM_API_KEY,DEEPGRAM_ENDPOINTING_MS,DEEPGRAM_LANGUAGE,DEEPGRAM_MODEL,OPENAI_API_KEY,ELEVENLABS_API_KEY
          script: |
            # stop_script: true 대체(1.0.3 부터 set -e로 대체됨)
            # https://www.inflearn.com/community/questions/1635430/appleboy-ssh-action-stop-script-%EB%8C%80%EC%B2%B4
            set -e

            echo "============================================"
            echo "Deployment Script"
            echo "============================================"

            # 1. 소스 코드 준비 (Git)
            echo "==> Prepare repository"
            rm -rf "$APP_DIR"
            git clone -b "$TARGET_BRANCH" "$REPO_URL" "$APP_DIR"

            cd "$APP_DIR"

            # 2. 기존 리소스 정리
            echo "==> Stop existing container"
            docker rm -f "$CONTAINER_NAME" || true

            echo "==> Remove old image"
            docker rmi "$IMAGE_NAME" || true

            # 3. 도커 이미지 빌드 및 최적화
            echo "==> Build image locally"
            docker build -t "$IMAGE_NAME" "$CONTEXT_DIR"

            echo "==> Cleanup dangling images"
            docker image prune -f

            # 4. 새 컨테이너 실행
            echo "==> Run container"
            docker run --name "$CONTAINER_NAME" \
              --network dorandoran \
              -p 8000:8000 \
              -e DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY" \
              -e DEEPGRAM_ENDPOINTING_MS="$DEEPGRAM_ENDPOINTING_MS" \
              -e DEEPGRAM_LANGUAGE="$DEEPGRAM_LANGUAGE" \
              -e DEEPGRAM_MODEL="$DEEPGRAM_MODEL" \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY" \
              -e ELEVENLABS_TTS_MODEL_ID="$ELEVENLABS_TTS_MODEL_ID" \
              -d "$IMAGE_NAME"

            # 5. 헬스체크
            echo "==> Health check"
            sleep 5
            if ! docker ps | grep -q "$CONTAINER_NAME"; then
              echo "Error: Container failed to start"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            echo "==> Deployment completed successfully"

        env:
          APP_DIR: ${{ vars.APP_DIR }}
          TARGET_BRANCH: ${{ vars.TARGET_BRANCH }}
          REPO_URL: ${{ vars.REPO_URL }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          CONTEXT_DIR: ${{ vars.CONTEXT_DIR }}
          DEEPGRAM_ENDPOINTING_MS: ${{ vars.DEEPGRAM_ENDPOINTING_MS }}
          DEEPGRAM_LANGUAGE: ${{ vars.DEEPGRAM_LANGUAGE }}
          DEEPGRAM_MODEL: ${{ vars.DEEPGRAM_MODEL }}
          ELEVENLABS_TTS_MODEL_ID: ${{ vars.ELEVENLABS_TTS_MODEL_ID }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

