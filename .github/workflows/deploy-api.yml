name: deploy-api

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: deploy-api-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # 1) Approved 리뷰 + 2) 대상 브랜치가 develop 인 PR만
    if: >
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy (clone -> stop -> build -> push -> run)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # 1. 환경 설정 및 변수 정의
            APP_DIR="$HOME/apps/drdr-backend-api"
            IMAGE_NAME="drdr-api-local"
            CONTAINER_NAME="${{ secrets.DOCKER_CONTAINER_API }}"
            REF_SHA="${{ github.event.pull_request.head.sha }}"

            # GitHub repo
            REPO_URL="git@github.com:${{ github.repository }}.git"

            CONTEXT_DIR="$APP_DIR/drdr-backend-api"

            # 2. 소스 코드 준비 (Git)
            echo "==> Prepare repository"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout -f "$REF_SHA"

            # 3. 기존 리소스 정리
            echo "==> Stop existing container"
            docker rm -f "$CONTAINER_NAME" || true

            echo "==> Remove old image"
            docker rmi "$IMAGE_NAME" || true

            # 4. 도커 이미지 빌드 및 최적화
            echo "==> Build image locally"
            docker build -t "$IMAGE_NAME" "$CONTEXT_DIR"

            echo "==> Cleanup dangling images"
            docker image prune -f

            # 5. 새 컨테이너 실행
            echo "==> Run container"
            docker run --name "$CONTAINER_NAME" \
              --env-file="$HOME/backup/.env" \
              --network dorandoran \
              -p 8000:8080 \
              -d "$IMAGE_NAME"
