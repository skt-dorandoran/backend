# ---- 기본 리스닝 ----
listening-port=3478
tls-listening-port=5349

# UDP/TCP 모두 허용 (모바일 환경에서 유리)
listening-ip=0.0.0.0

# ---- 릴레이 포트 대역 (방화벽에서 열 포트) ----
min-port=49160
max-port=49200

# ---- 서버 공인 IP 설정 ----
# 1) 서버가 공인 IP면 external-ip에 그 IP를 적습니다.
# 2) NAT 뒤면 "공인IP/내부IP" 형태로 적습니다. (예: external-ip=203.0.113.10/172.17.0.1)
external-ip=dorandoran.duckdns.org

# ---- 도메인/realm (ICE 서버 설정에서 realm과 일치시키는 편이 안정적) ----
realm=dorandoran.duckdns.org

# ---- 인증 방식: long-term credential ----
lt-cred-mech

# (A) 고정 유저/패스 방식 (가장 간단)
user=webrtc:dorandoran2@

# (B) REST API 방식(추천): 단기 credential 생성 (MVP 다음 단계)
# use-auth-secret
# static-auth-secret=YOUR_STATIC_SECRET
# stale-nonce=600

# ---- 보안/운영 기본 ----
fingerprint
no-multicast-peers
no-cli
no-tcp-relay

# 로그 (필요 시)
log-file=/var/log/turn/turn.log
simple-log

# 프로세스 권장 옵션
# (host 모드에서 root 권한 줄이기 등은 운영단에서 추가)