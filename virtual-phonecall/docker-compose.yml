services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./turn/data:/var/lib/coturn
      - ./turn/log:/var/log/turn
    command: ["-c", "/etc/coturn/turnserver.conf", "-n"]
  
  signaling:
    build: ./signaling
    container_name: webrtc_signaling
    restart: unless-stopped
    ports:
      - "8080:8080"
  
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    # ports: 
    #   - 8080:80
    volumes:
      - ./html:/usr/share/nginx/html

networks:
  default:
    name: dorandoran